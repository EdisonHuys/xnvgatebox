name: VPS tests and package
on:
  push:
    paths: ['vps/**', 'src/**', 'config/**', 'scripts/build_vps_package.py', '.github/workflows/vps.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vps:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.4'
          cache-dependency-path: vps/fanout/go.sum
      - run: go test ./...
        working-directory: vps/fanout
      - run: bash -n vps/install.sh vps/deploy/xnvgatebox
      - run: python scripts/build_vps_package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: xnvgatebox-linux-amd64
          path: dist/
