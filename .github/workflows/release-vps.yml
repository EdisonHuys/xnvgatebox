name: Publish tested VPS package
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful VPS tests and package run ID'
        required: true
        type: string
      tag:
        description: 'Release tag'
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify source run and publish its tested artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh run view "$RUN_ID" --json conclusion,workflowName,headSha > run.json
          python3 - <<'PYCODE'
          import json,pathlib
          r=json.loads(pathlib.Path('run.json').read_text())
          assert r['conclusion']=='success' and r['workflowName']=='VPS tests and package'
          pathlib.Path('source-sha').write_text(r['headSha'])
          PYCODE
          gh run download "$RUN_ID" -n xnvgatebox-linux-amd64 -D package
          (cd package && sha256sum --check checksums.txt)
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,tarfile
          with tarfile.open('package/xnvgatebox-linux-amd64.tar.gz') as t:
              members=t.getmembers()
              assert all(m.isfile() or m.isdir() for m in members), 'Unexpected archive entry'
              assert all(not pathlib.PurePosixPath(m.name).is_absolute() and '..' not in pathlib.PurePosixPath(m.name).parts for m in members), 'Unsafe archive path'
              assert len({m.name for m in members})==len(members), 'Duplicate archive entry'
              files={m.name:t.extractfile(m).read() for m in members if m.isfile()}
          sums=json.loads(files['package-sha256.json'])
          assert set(sums)==set(files)-{'package-sha256.json'}, 'Incomplete package manifest'
          assert all(hashlib.sha256(files[n]).hexdigest()==h for n,h in sums.items()), 'Package member mismatch'
          build=json.loads(files['BUILD.json'])
          assert files['VERSION'].decode().strip()==os.environ['RELEASE_TAG']==build['version'], 'Package version does not match release tag'
          assert build['git_head']==pathlib.Path('source-sha').read_text().strip(), 'Package is from another commit'
          assert build['source_dirty'] is False and build['manager_origin']=='built_from_source', 'Release requires a clean source build'
          PYCODE
          if gh release view "$RELEASE_TAG" --json isDraft > existing-release.json 2>/dev/null; then
            python3 - <<'PYCODE'
          import json
          assert json.load(open('existing-release.json'))['isDraft'], 'Refusing to overwrite a published release'
          PYCODE
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$(cat source-sha)" --draft --title "xnvgatebox $RELEASE_TAG" --notes 'VPS Standalone. See repository README for installation and validation limits.'
          fi
          gh release upload "$RELEASE_TAG" package/xnvgatebox-linux-amd64.tar.gz package/checksums.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
